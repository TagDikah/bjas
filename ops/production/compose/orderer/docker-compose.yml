services:
  orderer:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer.example.com
    env_file:
      - ../../env/orderer.env.example
    volumes:
      - /srv/fabric/orderer/msp:/var/hyperledger/orderer/msp:ro
      - /srv/fabric/orderer/tls:/var/hyperledger/orderer/tls:ro
      - /srv/fabric/orderer/config:/var/hyperledger/orderer/config:ro
      - /srv/fabric/orderer/data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 7050"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
