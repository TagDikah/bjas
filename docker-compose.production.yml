services:
  web:
    build:
      context: .
    env_file:
      - .env.production
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_CA_FILE: /run/secrets/db_ca
      FABRIC_TLS_CERT_PATH: /run/secrets/fabric_tls_cert
      FABRIC_CLIENT_CERT_PATH: /run/secrets/fabric_client_cert
      FABRIC_CLIENT_KEY_PATH: /run/secrets/fabric_client_key
    secrets:
      - db_password
      - db_ca
      - fabric_tls_cert
      - fabric_client_cert
      - fabric_client_key
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/system').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    depends_on:
      ai-judge:
        condition: service_healthy

  ai-judge:
    build:
      context: ./ai
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-google/flan-t5-base}
      HF_API_TOKEN_FILE: /run/secrets/hf_api_token
    secrets:
      - hf_api_token
    volumes:
      - ai_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

secrets:
  db_password:
    file: ./ops/secrets/db_password.txt
  db_ca:
    file: ./ops/secrets/db_ca.pem
  fabric_tls_cert:
    file: ./ops/secrets/fabric_tls_cert.pem
  fabric_client_cert:
    file: ./ops/secrets/fabric_client_cert.pem
  fabric_client_key:
    file: ./ops/secrets/fabric_client_key.pem
  hf_api_token:
    file: ./ops/secrets/hf_api_token.txt

volumes:
  ai_model_cache:
