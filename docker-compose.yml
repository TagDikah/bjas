services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-blockchain}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
    # Firewall-by-default:
    # - We bind MySQL ONLY to localhost on the host machine, so it is not reachable from the internet/LAN.
    # - Your Next.js app can still reach it inside the Docker network via host "mysql".
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - "mysqld"
      - "--sql_mode=STRICT_ALL_TABLES"
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"

  web:
    build: .
    environment:
      # In docker, connect via service name
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${DB_NAME:-blockchain}
      JUDGE_AI_SERVICE_URL: http://ai-judge:5000
    ports:
      - "3000:3000"
    depends_on:
      - mysql
      - ai-judge

  ai-judge:
    build:
      context: ./ai
    environment:
      HF_MODEL_ID: ${HF_MODEL_ID:-google/flan-t5-base}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HF_API_URL: ${HF_API_URL:-}
    ports:
      - "5000:5000"
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  mysql_data:
  hf_cache:
